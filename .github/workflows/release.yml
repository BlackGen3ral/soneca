name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a version tag such as v1.0.0' }
          ./scripts/build.ps1 -Version $version
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/ArthoAI-Setup.exe dist/ArthoControl-Setup.exe dist/Soneca-Setup.exe dist/SHA256SUMS.txt --verify-tag --title 'Artho AI ${{ github.ref_name }}' --generate-notes
